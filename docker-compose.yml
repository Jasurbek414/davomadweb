version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: davomad_db
    environment:
      POSTGRES_DB: ${DB_NAME:-davomad_db}
      POSTGRES_USER: ${DB_USER:-davomad}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-davomad_pass123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-davomad}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: davomad_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: davomad_backend
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - media_files:/app/media
      - static_files:/app/static
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py create_superadmin &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: davomad_celery
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - media_files:/app/media
    depends_on:
      - backend
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency=4

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: davomad_celery_beat
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - backend
    restart: unless-stopped
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  parent-bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: davomad_parent_bot
    env_file: .env
    environment:
      - BOT_TOKEN=${PARENT_BOT_TOKEN}
      - API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    command: python parent_bot.py

  management-bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: davomad_management_bot
    env_file: .env
    environment:
      - BOT_TOKEN=${MANAGEMENT_BOT_TOKEN}
      - API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    command: python management_bot.py

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
        - VITE_PARENT_BOT_USERNAME=${VITE_PARENT_BOT_USERNAME:-davomad_parent_bot}
        - VITE_MANAGEMENT_BOT_USERNAME=${VITE_MANAGEMENT_BOT_USERNAME:-davomad_management_bot}
    container_name: davomad_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media_files:
  static_files:
